apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: spark-checkpoints}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: spark}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: spark}}
  template:
    metadata: {labels: {app: spark}}
    spec:
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      terminationGracePeriodSeconds: 30
      containers:
        - name: spark
          image: terra-newsphere-spark:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: terra-config}}]
          env:
            - {name: SPARK_MASTER, value: "local[1]"}
            - {name: SPARK_DRIVER_MEMORY, value: 768m}
            - {name: SPARK_CHECKPOINT, value: /var/lib/terra/checkpoints/news}
            - {name: SPARK_MAX_OFFSETS, value: "200"}
            - {name: SPARK_TRIGGER_SECONDS, value: "30"}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
          volumeMounts: [{name: checkpoints, mountPath: /var/lib/terra/checkpoints}]
      volumes:
        - name: checkpoints
          persistentVolumeClaim: {claimName: spark-checkpoints}
