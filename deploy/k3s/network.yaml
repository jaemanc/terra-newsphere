apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: private-backend}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 80, protocol: TCP}, {port: 8000, protocol: TCP}]
