apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terra-newsphere
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: terra-newsphere-https-only@kubernetescrd,terra-newsphere-secure-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - news.example.com
    secretName: terra-tls
  rules:
  - host: news.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
