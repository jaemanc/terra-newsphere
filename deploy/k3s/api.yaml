apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
  - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: terra-newsphere-api:0.1.0
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: terra-config
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8000
          periodSeconds: 20
        env:
        - name: REDIS_USERNAME
          value: api
        - name: REDIS_PASSWORD_FILE
          value: /run/secrets/redis_api
        volumeMounts:
        - name: redis-secret
          mountPath: /run/secrets
          readOnly: true
        - name: temporary
          mountPath: /tmp
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
          readOnlyRootFilesystem: true
      volumes:
      - name: redis-secret
        secret:
          secretName: terra-redis-auth
          items:
          - key: redis_api
            path: redis_api
      - name: temporary
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      automountServiceAccountToken: false
