apiVersion: apps/v1
kind: Deployment
metadata: {name: collector}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: collector}}
  template:
    metadata: {labels: {app: collector}}
    spec:
      containers:
        - name: collector
          image: terra-newsphere-collector:0.1.0
          imagePullPolicy: IfNotPresent
          command: [python, /app/collector/main.py]
          envFrom: [{configMapRef: {name: terra-config}}]
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
