name: terra-newsphere
x-python-env: &id001
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC: news.raw
  GEOGRAPHY_DIR: /app/geo/generated
  REDIS_USERNAME: api
  REDIS_PASSWORD_FILE: /run/secrets/redis_api
services:
  redis:
    image: redis:7.4.11-alpine
    command:
    - sh
    - /etc/redis/start.sh
    volumes:
    - ./redis/redis.conf:/etc/redis/redis.conf:ro
    - ./redis/start.sh:/etc/redis/start.sh:ro
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - REDISCLI_AUTH="$$(cat /run/secrets/redis_health)" redis-cli --user health ping
      interval: 10s
      timeout: 3s
      retries: 5
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - storage
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
    user: 999:1000
    secrets:
    - redis_api
    - redis_collector
    - redis_processor
    - redis_health
  kafka:
    image: apache/kafka:4.0.2
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 536870912
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
    - kafka-data:/var/lib/kafka/data
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ingestion
  kafka-init:
    image: apache/kafka:4.0.2
    entrypoint:
    - sh
    - /app/create-topic.sh
    volumes:
    - ./kafka/create-topic.sh:/app/create-topic.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ingestion
  api:
    image: terra-newsphere-api:0.1.0
    build:
      context: .
      dockerfile: deploy/docker/python.Dockerfile
      args:
        ROLE: api
    environment: *id001
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 10s
      timeout: 5s
      retries: 5
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - web-entry
    - storage
    secrets:
    - redis_api
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
  collector:
    image: terra-newsphere-collector:0.1.0
    build:
      context: .
      dockerfile: deploy/docker/python.Dockerfile
      args:
        ROLE: collector
    command:
    - python
    - /app/collector/main.py
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: news.raw
      GEOGRAPHY_DIR: /app/geo/generated
      GDELT_QUERY: ${GDELT_QUERY:-(climate OR earthquake OR economy OR technology)}
      COLLECT_INTERVAL_SECONDS: ${COLLECT_INTERVAL_SECONDS:-900}
      RSS_URLS: ${RSS_URLS-https://feeds.bbci.co.uk/news/world/rss.xml,https://feeds.bbci.co.uk/news/world/asia/rss.xml,https://feeds.bbci.co.uk/news/world/europe/rss.xml,https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml,https://feeds.bbci.co.uk/news/world/africa/rss.xml,https://feeds.bbci.co.uk/news/world/middle_east/rss.xml,https://feeds.bbci.co.uk/news/world/latin_america/rss.xml,https://feeds.bbci.co.uk/news/business/rss.xml,https://feeds.bbci.co.uk/news/technology/rss.xml,https://feeds.bbci.co.uk/news/science_and_environment/rss.xml,https://feeds.bbci.co.uk/news/uk/rss.xml,https://feeds.bbci.co.uk/news/health/rss.xml,https://feeds.bbci.co.uk/news/politics/rss.xml,https://feeds.bbci.co.uk/news/education/rss.xml,https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml,https://feeds.bbci.co.uk/news/england/rss.xml,https://feeds.bbci.co.uk/news/scotland/rss.xml,https://feeds.bbci.co.uk/news/wales/rss.xml,https://feeds.bbci.co.uk/news/northern_ireland/rss.xml,https://feeds.bbci.co.uk/news/bbcverify/rss.xml,https://www.lemonde.fr/en/international/rss_full.xml,https://www.lemonde.fr/en/europe/rss_full.xml,https://www.lemonde.fr/en/france/rss_full.xml,https://www.lemonde.fr/en/economy/rss_full.xml,https://www.lemonde.fr/en/politics/rss_full.xml,https://www.lemonde.fr/en/environment/rss_full.xml,https://www.lemonde.fr/en/culture/rss_full.xml,https://www.lemonde.fr/en/science/rss_full.xml,https://www.lemonde.fr/en/sports/rss_full.xml,https://www.lemonde.fr/en/pixels/rss_full.xml,https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=01&plink=RSSREADER,https://news.sbs.co.kr/news/newsflashRssFeed.do?plink=RSSREADER,https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=02&plink=RSSREADER,https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=03&plink=RSSREADER,https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=07&plink=RSSREADER,https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=08&plink=RSSREADER,https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=09&plink=RSSREADER,https://www.ungeneva.org/en/news-media/press-items-list/rss.xml,https://www.lemonde.fr/en/artificial-intelligence/rss_full.xml}
      RSS_POLICY_FILE: /app/collector/rss-policy.json
      REDIS_USERNAME: collector
      REDIS_PASSWORD_FILE: /run/secrets/redis_collector
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ingestion
    - storage
    secrets:
    - redis_collector
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
  spark:
    image: terra-newsphere-spark:0.1.0
    build:
      context: .
      dockerfile: spark/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: news.raw
      GEOGRAPHY_DIR: /app/geo/generated
      SPARK_MASTER: local[1]
      SPARK_CHECKPOINT: /var/lib/terra/checkpoints/news
      SPARK_MAX_OFFSETS: ${SPARK_MAX_OFFSETS:-200}
      SPARK_TRIGGER_SECONDS: ${SPARK_TRIGGER_SECONDS:-30}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-768m}
      REDIS_USERNAME: processor
      REDIS_PASSWORD_FILE: /run/secrets/redis_processor
    volumes:
    - spark-checkpoints:/var/lib/terra/checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 2g
    cpus: 1
    restart: unless-stopped
    stop_grace_period: 30s
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - ingestion
    - storage
    secrets:
    - redis_processor
  frontend:
    image: terra-newsphere-frontend:0.1.0
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN:-}
        VITE_OSM_TILE_URL: ${VITE_OSM_TILE_URL:-https://tile.openstreetmap.org/}
    ports:
    - 127.0.0.1:${WEB_PORT:-8080}:8080
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
    - web-entry
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
volumes:
  kafka-data: null
  spark-checkpoints: null
networks:
  storage:
    internal: true
  ingestion: {}
  web-entry: {}
secrets:
  redis_api:
    file: ./.runtime/security/redis_api
  redis_collector:
    file: ./.runtime/security/redis_collector
  redis_processor:
    file: ./.runtime/security/redis_processor
  redis_health:
    file: ./.runtime/security/redis_health
