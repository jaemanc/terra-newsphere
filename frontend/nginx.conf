limit_req_zone $binary_remote_addr zone=api_ip:1m rate=5r/s;
limit_req_zone $server_name zone=api_total:1m rate=40r/s;
limit_conn_zone $server_name zone=api_connections:1m;
limit_conn_zone $binary_remote_addr zone=client_connections:1m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 128k;
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 15s;
    limit_conn_status 429;
    limit_req_status 429;
    # Only the configured reverse-proxy network can supply a client IP.
    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https:; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

    location /api/ {
        limit_req zone=api_ip burst=20 nodelay;
        limit_req zone=api_total burst=40 nodelay;
        limit_conn api_connections 32;
        limit_conn client_connections 8;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /geo/ { try_files $uri =404; }
    location /imagery/ { try_files $uri =404; }
    location /cesium/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
