[project]
name = "terra-newsphere"
version = "0.1.0"
description = "Ephemeral global news on a Cesium globe"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic==2.11.7", "redis==6.2.0"]

[project.optional-dependencies]
api = ["fastapi==0.143.0", "starlette==1.3.1", "uvicorn==0.35.0"]
collector = ["kafka-python==2.3.2", "httpx==0.28.1", "feedparser==6.0.11"]
spark = ["pyspark==4.0.2"]
geo = ["shapely==2.1.1", "httpx==0.28.1", "pycountry==24.6.1"]
dev = ["httpx==0.28.1", "PyYAML==6.0.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/terra_newsphere"]
