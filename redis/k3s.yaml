apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7.4.5-alpine
          command: [redis-server, /etc/redis/redis.conf]
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 100m, memory: 288Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts: [{name: config, mountPath: /etc/redis}]
          readinessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 10}
          livenessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 20}
      volumes:
        - name: config
          configMap: {name: redis-config}
