apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
  - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.4.11-alpine
        command:
        - sh
        - /etc/redis/start.sh
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 100m
            memory: 288Mi
          limits:
            cpu: 500m
            memory: 384Mi
        volumeMounts:
        - name: config
          mountPath: /etc/redis
        - name: redis-secret
          mountPath: /run/secrets
          readOnly: true
        - name: temporary
          mountPath: /tmp
        readinessProbe:
          exec: &id001
            command:
            - sh
            - -c
            - REDISCLI_AUTH="$(cat /run/secrets/redis_health)" redis-cli --user health
              ping
          periodSeconds: 10
        livenessProbe:
          exec: *id001
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
      - name: config
        configMap:
          name: redis-config
      - name: redis-secret
        secret:
          secretName: terra-redis-auth
      - name: temporary
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
